<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<title>Сатрҳо — студия</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Fira+Code&family=IBM+Plex+Mono&family=Roboto+Mono&family=Montserrat:wght@600&family=Rubik:wght@500&family=Russo+One&family=Oswald:wght@500&family=Exo+2:wght@600&family=Comfortaa:wght@600&family=Playfair+Display:wght@600&family=Cormorant+Garamond:wght@600&family=Lora:wght@600&family=Pacifico&family=Marck+Script&family=Caveat:wght@600&family=Press+Start+2P&family=Amatic+SC:wght@700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0b0f;--fg:#ececf1;--mut:#8b8b98;--card:#17171e;--line:#2a2a34;--c1:#ff2d4a;--c2:#2ee6ff;--c3:#ffd23f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Roboto",sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
#top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-weight:600}
#top button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}
#stage{position:relative;overflow:hidden;background:#000;border-radius:10px;border:1px solid var(--line)}
#stage:fullscreen{width:100vw!important;height:100vh!important;border-radius:0;border:0}
#bg{position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.9) 16%,rgba(0,0,0,0) 85%)}
#persp{position:absolute;inset:0}
#cam{position:absolute;inset:0;transform-style:preserve-3d}
#bgp{position:absolute;inset:-60%}
#plane,#hist{transform-style:preserve-3d}
#plane{position:absolute;left:0;right:0;top:50%}
#band{background:rgba(255,255,255,.07);border-block:1px solid rgba(255,255,255,.18);padding:calc(var(--u)*5);font-size:calc(var(--u)*6.4);line-height:1.35;min-height:calc(var(--u)*18);text-shadow:0 0 10px rgba(255,255,255,.25);word-break:break-word}
.w{display:inline-block;white-space:nowrap}.w span{display:inline-block}
.k1{color:var(--c1);text-shadow:0 0 12px var(--c1)}.k1b{color:var(--c2);text-shadow:0 0 12px var(--c2)}.k3{color:var(--c3);text-shadow:0 0 12px var(--c3)}
.k4{text-shadow:2px 0 var(--c1),-2px 0 var(--c2);animation:gl .22s steps(2) infinite}
@keyframes gl{50%{translate:2px -1px}}
.cur{display:inline-block;width:.5em;height:1em;border-radius:3px;background:var(--c1);box-shadow:0 0 14px var(--c1);vertical-align:-.12em;margin-left:3px;animation:b 1s steps(2) infinite}
#plane{font-size:calc(var(--u)*6.4);line-height:1.35}
.cb{color:#7aa7ff}.co{color:#ff9a4d;text-shadow:0 0 12px rgba(255,154,77,.5)}.pn{color:#6b6f7e;display:inline-block}
.cw{background:rgba(70,110,255,.38);border-radius:.25em;padding:0 .08em;box-shadow:0 0 16px rgba(70,110,255,.4)}
#stage.code #band{position:relative;display:block;white-space:nowrap;width:max-content;min-width:100%;padding-left:calc(var(--u)*9);padding-right:calc(var(--u)*30);background:rgba(255,255,255,.06);color:#e8e8f2}
#hist{position:absolute;left:0;right:0;bottom:100%;display:flex;flex-direction:column-reverse;align-items:flex-start;pointer-events:none}
.hl{white-space:nowrap;width:max-content;min-width:100%;padding:calc(var(--u)*1.4) calc(var(--u)*9);transition:opacity .4s,filter .4s}
#lnum{position:absolute;left:calc(var(--u)*3);top:50%;transform:translateY(-50%);font-size:.55em;color:#555a6a;display:none}
#stage.code #lnum{display:block}
#card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:2}
.dlg{width:78%;background:#14161d;border:1px solid #2a2e3a;border-radius:calc(var(--u)*2);padding:calc(var(--u)*4);font-size:calc(var(--u)*3.4);box-shadow:0 20px 60px #000a}
.dlg small{color:#6b6f7e;display:block;font-size:.7em;margin-bottom:.6em}.dlg b{font-size:1.5em;display:block}.dlg p{color:#8b8fa0;font-size:.8em;margin:.4em 0 1.4em}
.dlg .bt{display:flex;justify-content:flex-end;gap:.6em}.dlg .bt span{padding:.5em 1em;border-radius:.5em;background:#242834;font-weight:600}.dlg .bt .ok{background:var(--c1);color:#fff}
.ptr{position:absolute;z-index:3;line-height:1;color:#fff;text-shadow:0 0 6px #000}
.ttl{position:absolute;inset:0;background:linear-gradient(#090d18,#18223a 55%,#76849e);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.moon{width:calc(var(--u)*26);height:calc(var(--u)*26);border-radius:50%;background:radial-gradient(circle at 30% 28%,#f4f6fb,#b9c0cf 70%,#8d96a8);box-shadow:0 0 calc(var(--u)*8) rgba(200,210,235,.5);position:relative;margin-bottom:calc(var(--u)*5)}
.moon::before{content:'';position:absolute;left:24%;top:30%;width:18%;height:18%;border-radius:50%;background:#9aa2b4;box-shadow:calc(var(--u)*8) calc(var(--u)*6) #a2aabb}
.ttl h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:calc(var(--u)*8);margin:0}
.ttl p{font-family:Georgia,serif;font-style:italic;font-size:calc(var(--u)*3.6);color:#c8cfe0;margin:.6em 0 0}
#wm{position:absolute;bottom:calc(var(--u)*5);width:100%;text-align:center;font-family:Georgia,serif;font-size:calc(var(--u)*3.3);color:#cfd2dc;opacity:.8;z-index:3}
#grain{position:absolute;inset:-50%;pointer-events:none;mix-blend-mode:overlay;animation:gr .5s steps(4) infinite;z-index:4}
@keyframes gr{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
#vg2{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000 125%);z-index:4}
#bars{position:absolute;inset:0;pointer-events:none;display:none;z-index:4;background:linear-gradient(#000 0 9%,transparent 9% 91%,#000 91%)}
.hd{position:absolute;right:0;top:0;bottom:0;width:20px;background:rgba(255,255,255,.3);z-index:2;touch-action:none;display:flex;align-items:center;justify-content:center;font-size:12px}
@keyframes b{50%{opacity:.2}}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;color:var(--mut);font-size:14px;z-index:2}
#empty div{font-size:44px}
#ctl{flex:none;display:flex;align-items:center;gap:10px;padding:4px 12px}
#ctl button{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px}
#pl{background:var(--c1)!important;border-color:var(--c1)!important;width:46px;font-size:18px!important}
#tm{margin-left:auto;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
#tl{flex:none;height:128px;overflow-x:auto;overflow-y:hidden;background:#101016;border-top:1px solid var(--line)}
#tin{position:relative;height:116px}
.tick{position:absolute;top:0;height:18px;font-size:10px;color:var(--mut);border-left:1px solid var(--line);padding-left:3px}
.clip{position:absolute;top:22px;height:54px;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#23232d}
.clip.on{border-color:#fff}
.fs{position:absolute;left:0;right:0;bottom:0;height:30px;font-size:22px;opacity:.5;white-space:nowrap;overflow:hidden}
.lb{position:absolute;top:3px;left:6px;right:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1;text-shadow:0 1px 2px #000}
.sc{position:absolute;right:24px;bottom:2px;font-size:10px;background:#000b;border-radius:4px;padding:0 4px;z-index:1}
.add{position:absolute;top:22px;width:54px;height:54px;border-radius:8px;background:var(--card);border:1px dashed #555;font-size:26px;display:flex;align-items:center;justify-content:center}
#mrow{position:absolute;top:80px;left:20px;height:34px;border-radius:8px;background:#15251f;border:1px solid #2f4a3e;display:flex;align-items:center;font-size:12px;color:#9fd8bd;padding:0 8px;overflow:hidden;white-space:nowrap;min-width:110px}
#ph{position:absolute;top:0;bottom:0;left:20px;width:2px;background:#fff;z-index:3;pointer-events:none}
#pn{flex:none;max-height:200px;overflow-y:auto;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;display:none}
#tb{flex:none;display:flex;overflow-x:auto;background:#0e0e13;border-top:1px solid var(--line);padding:4px}
.tbtn{flex:none;width:66px;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0}
.tbtn b{font-size:21px;font-weight:400}.tbtn.on{color:#fff}.tbtn.on b{filter:drop-shadow(0 0 6px var(--c1))}
.cp{display:inline-block;padding:8px 13px;margin:0 6px 6px 0;border-radius:18px;background:#23232d;border:1px solid var(--line);font-size:14px}
.cp.on{background:var(--c1);border-color:var(--c1)}
.txt{width:100%;background:#0e0e13;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;margin-bottom:8px}
.ct{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin:6px 0}
.ct span{width:96px;flex:none}.ct output{width:46px;text-align:right;flex:none}
.ct input{flex:1;accent-color:var(--c1)}
.cl{display:flex;gap:8px}.cl label{flex:1;font-size:12px;color:var(--mut);text-align:center}
.cl input{width:100%;height:38px;border:0;background:none;padding:0}
.mut{color:var(--mut);font-size:13px;margin:4px 0 8px;line-height:1.5}
#mf,#pf{position:absolute;left:-9999px;opacity:0;width:1px;height:1px}
</style>
</head>
<body>
<div id="app">
  <div id="top"><span>🎬 Сатрҳо</span><button id="fs">⛶ Намоиш</button></div>
  <div id="wrap">
    <div id="stage">
      
      <div id="persp"><div id="cam"><div id="bgp"><canvas id="bg"></canvas><div id="vig"></div></div><div id="plane"><div id="hist"></div><div id="band"></div><div id="lnum"></div></div></div></div>
      <div id="card"></div><div id="wm"></div><div id="scan"></div><div id="vg2"></div><div id="grain"></div><div id="bars"></div>
      <div id="empty"><div>🎬</div><span>Лоиҳаи холӣ</span><button class="cp on" id="e1">➕ Сатри аввалро илова кунед</button></div>
    </div>
  </div>
  <div id="ctl"><button id="pl">▶</button><button id="rp">↻ Сатр</button><span id="tm">0.0 / 0.0с</span></div>
  <div id="tl"><div id="tin"></div></div>
  <div id="pn"></div>
  <div id="tb"></div>
</div>
<input type="file" id="mf" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac"><input type="file" id="pf" accept=".json,application/json">
<script>
const $=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const h=(t,p={},...c)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...c);return e};
const A=[['type','Чоп'],['decode','Рамзкушоӣ'],['fade','Пайдошавӣ'],['drop','Афтидан'],['zoom','Калон шудан'],['wave','Мавҷ']];
const EM={type:'⌨️',decode:'🔐',fade:'🌫️',drop:'💧',zoom:'🔍',wave:'🌊'};
const TOOLS=[['add','➕','Илова'],['txt','✏️','Матн'],['anim','🎞','Аниматсия'],['pos','📍','Ҷой'],['d3','🧊','3D'],['col','🎨','Ранг'],['bg','🌌','Фон'],['fnt','🔤','Фонт'],['fx','✨','Эффект'],['mus','🎵','Мусиқӣ'],['sv','💾','Захира'],['ln','🧰','Сатр']];
const PX=44;
let S={L:[],sel:-1,g:{pp:700,dr:45,tilt:true,sw:30,bd:350,fol:true,ba:'drift',gr:12,gl:10,ca:0,vg:35,hue:0,sat:100,con:100,bars:false,bgm:'stars',style:'code',haze:true,focus:true,wm:'',c1:'#ff2d4a',c2:'#2ee6ff',c3:'#ffd23f',cb:'#29ff8a',fnt:'m',scn:true,vol:80}};
let tool=null,running=false,raf=0,t0=0,ct0=0,ci=0,cur=null,rid=0,starts=[],durs=[],total=0,pan=0,tpan=0,prog=0,ps=0;
let ctx=null,buf=null,aEl=null,src=null,gn=null,an=null,ab8=null,lvl=0,mname='',mmsg='',peaks=[],cols=[],cache=[],W=0,H=0,stars=[];
const newClip=()=>({k:'t',t:'Салом ҷаҳон',s:'',b1:'Не',b2:'Ҳа',f:'JetBrains Mono',fz:100,a:'type',y:50,al:'center',rnd:0,spd:70,hold:1500,ry:-26,rx:5,rz:0});
try{const n=localStorage.getItem('satrho4'),d=JSON.parse(n||localStorage.getItem('satrho3')||'null');if(d){S.L=(d.L||[]).map(x=>({k:'t',s:'',b1:'Не',b2:'Ҳа',...x}));if(n)Object.assign(S.g,d.g);S.sel=S.L.length?0:-1}}catch(e){}
const sv=()=>{try{localStorage.setItem('satrho4',JSON.stringify({L:S.L,g:S.g}))}catch(e){}};
const strip=s=>s.replace(/[*_^~]/g,'');
const MK={'*':'k1','_':'k1b','^':'k3','~':'k4','\u0001':'cb','\u0002':'co'};
function codify(t){if(/[.(;]/.test(t))return t;const w=t.trim().split(/\s+/).filter(Boolean),n=w.length;if(!n)return t;const pal=['','\u0001','','\u0001'],k=n>=3?2:n>=2?1:0,col=(x,i)=>pal[i%4]?pal[i%4]+x+pal[i%4]:x;
  let o='';for(let i=0;i<n-k;i++)o+=col(w[i],i)+(i<n-k-1?'.':'');if(k)o+='(\u0002'+w.slice(n-k).join('.')+'\u0002)';return o+';'}
const disp=l=>S.g.style==='code'?codify(l.t):l.t;
const nChars=s=>[...s].filter(c=>!MK[c]&&c!==' ').length;
function effSpeed(l){if(!l.dur)return l.spd;const n=Math.max(1,nChars(disp(l))),D=l.dur*1000,hd=Math.min(l.hold,D*.4),an=D-380-hd-((l.a==='type'||l.a==='decode')?0:560);return Math.max(8,an/n)}
function effHold(l){return l.dur?Math.min(l.hold,l.dur*400):l.hold}
function calc(){let s=0;starts=[];durs=S.L.map(l=>{let d;if(l.k!=='t')d=l.dur||3.5;else if(l.dur)d=l.dur;else{const n=nChars(disp(l)),b=(l.a==='type'||l.a==='decode')?n*l.spd:n*l.spd+560;d=(b+l.hold+380)/1000}starts.push(s);s+=d;return d});total=s}
function theme(){const r=document.documentElement.style,g=S.g;r.setProperty('--c1',g.c1);r.setProperty('--c2',g.c2);r.setProperty('--c3',g.c3);
  $('plane').style.fontFamily=g.fnt==='m'?'ui-monospace,"Roboto Mono",Menlo,monospace':'inherit';$('scan').style.display=g.scn?'block':'none';$('stage').classList.toggle('code',g.style==='code');$('vig').style.display=(g.bgm==='code'||g.bgm==='rain')?'block':'none';$('wm').textContent=g.wm;fx()}

/* background */
const cv=$('bg'),bx=cv.getContext('2d');
const TK=['function','const','return','if(','else','{','}','=>','0x','sudo','rm -rf','ssh','root@','chmod','while(1)','for(;;)','import','exploit','payload','0101','</>','&&','||','kernel','0xFF','null',';','()','[]','token','bash','--force'];
const mk=()=>{let n=2+Math.random()*7|0,s=' '.repeat(Math.random()*4|0);for(let i=0;i<n;i++)s+=TK[Math.random()*TK.length|0]+' ';return s};
function sizeBg(){W=cv.width=Math.round($('stage').clientWidth*2.2);H=cv.height=Math.round($('stage').clientHeight*2.2);cols=Array.from({length:Math.ceil(W/16)},()=>Math.random()*H);if(stars.w!==W||stars.h!==H){stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,p:Math.random()*6}));stars.w=W;stars.h=H}bx.fillStyle='#000';bx.fillRect(0,0,W,H)}
function haze(t){if(!S.g.haze)return;const gr=bx.createRadialGradient(W*(.5+.25*Math.sin(t*.2)),H*.12,0,W*.5,H*.12,W);gr.addColorStop(0,S.g.c1);gr.addColorStop(1,'rgba(0,0,0,0)');bx.globalAlpha=Math.min(.6,.17+.06*Math.sin(t*.6)+lvl*.3);bx.fillStyle=gr;bx.fillRect(0,0,W,H);bx.globalAlpha=1}
function drawX(m,t){if(!['grid','aurora','bokeh','waves','dust'].includes(m))return false;const P=[S.g.c1,S.g.c2,S.g.c3],lv=1+lvl*.8;
  bx.globalCompositeOperation='source-over';bx.globalAlpha=1;bx.fillStyle='#04040a';bx.fillRect(0,0,W,H);
  if(m==='aurora'){bx.globalCompositeOperation='lighter';P.forEach((c,i)=>{const x=W*(.5+.38*Math.sin(t*.12+i*2)),y=H*(.4+.25*Math.cos(t*.1+i*3)),g=bx.createRadialGradient(x,y,0,x,y,W*.75);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');bx.globalAlpha=Math.min(.5,.2*lv);bx.fillStyle=g;bx.fillRect(0,0,W,H)})}
  else if(m==='bokeh'||m==='dust'){stars.slice(0,m==='bokeh'?24:90).forEach((s,i)=>{const rr=m==='bokeh'?W*.03+s.r*W*.03:s.r*1.6,x=(s.x+t*(6+s.r*8)*(i%2?1:-1)+W*9)%W,y=m==='dust'?(s.y-t*(10+s.r*14)+H*9)%H:s.y+Math.sin(t*.3+s.p)*20;
    if(m==='bokeh'){const g=bx.createRadialGradient(x,y,0,x,y,rr);g.addColorStop(0,P[i%3]);g.addColorStop(1,'rgba(0,0,0,0)');bx.globalAlpha=Math.min(.5,.16*lv);bx.fillStyle=g;bx.beginPath();bx.arc(x,y,rr,0,6.3);bx.fill()}
    else{bx.globalAlpha=.3+.3*Math.sin(t+s.p);bx.fillStyle='#fff';bx.fillRect(x,y,rr,rr)}})}
  else if(m==='waves'){bx.lineWidth=2;for(let k=0;k<7;k++){bx.beginPath();bx.strokeStyle=P[k%3];bx.globalAlpha=.28;for(let x=0;x<=W;x+=12){const y=H*(.3+.06*k)+Math.sin(x*.006+t*.6+k)*H*.05*lv+Math.sin(x*.013-t*.4)*H*.02;x?bx.lineTo(x,y):bx.moveTo(x,y)}bx.stroke()}}
  else{bx.strokeStyle=P[1];bx.lineWidth=1.5;bx.globalAlpha=.4;const hz=H*.45;for(let i=-20;i<=20;i++){bx.beginPath();bx.moveTo(W/2+i*W*.04,hz);bx.lineTo(W/2+i*W*.5,H);bx.stroke()}
    for(let j=0;j<14;j++){const f=(j+(t*.35)%1)/14,y=hz+(H-hz)*f*f;bx.globalAlpha=.15+.5*f;bx.beginPath();bx.moveTo(0,y);bx.lineTo(W,y);bx.stroke()}
    const g2=bx.createLinearGradient(0,0,0,hz);g2.addColorStop(0,'rgba(0,0,0,0)');g2.addColorStop(1,P[0]);bx.globalAlpha=Math.min(.5,.25*lv);bx.fillStyle=g2;bx.fillRect(0,0,W,hz)}
  bx.globalCompositeOperation='source-over';bx.globalAlpha=1;haze(t);return true}
function drawBg(t){const m=S.g.bgm,c=S.g.cb;if(drawX(m,t))return;
  if(m==='none'||m==='stars'){bx.fillStyle='#000';bx.fillRect(0,0,W,H);if(m==='stars')stars.forEach(s=>{bx.globalAlpha=.25+.25*Math.sin(t*.9+s.p);bx.fillStyle='#fff';bx.beginPath();bx.arc(s.x,s.y,s.r,0,6.3);bx.fill()});bx.globalAlpha=1;haze(t);return}
  if(m==='code'){bx.fillStyle='#000';bx.fillRect(0,0,W,H);bx.font='14px ui-monospace,Menlo,monospace';bx.fillStyle=c;bx.globalAlpha=.2;
    const sp=t*14,k0=Math.floor(sp/18),off=sp%18;
    for(let i=0;i<H/18+2;i++){const k=k0+i;cache[k]=cache[k]||mk();bx.fillText(cache[k],6,i*18-off)}
    bx.globalAlpha=1;if(cache.length>3000)cache=[];haze(t)}
  else{bx.fillStyle='rgba(0,0,0,.09)';bx.fillRect(0,0,W,H);bx.font='15px ui-monospace,Menlo,monospace';bx.fillStyle=c;bx.globalAlpha=.5;
    cols.forEach((y,i)=>{bx.fillText('01{}<>/;=+*'[Math.random()*11|0],i*16,y);cols[i]=y>H+Math.random()*900?0:y+16});bx.globalAlpha=1}}
