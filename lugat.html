<!DOCTYPE html>
<html lang="tg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Луғат</title>
<style>
:root{--bg:#fff;--tx:#1d2330;--mut:#7a8296;--ok:#1b7f4b;--no:#c0353d;--ac:#2f6fed;--bd:#e3e6ee}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--tx:#e8ebf3;--mut:#8b94a8;--ok:#5bd18f;--no:#ff8a92;--ac:#6b9bff;--bd:#272d3e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:4px 0 6px;border-bottom:1px solid var(--bd)}
.bar b{font-size:15px}
#st{flex:1;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mb{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:4px 10px;font-size:15px}
#t{width:100%;border:0;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx);padding:6px 0;margin:4px 0;font:inherit;outline:none}
.r{padding:5px 0;border-bottom:1px solid var(--bd);word-break:break-word}
.n{color:var(--mut);font-size:11px;margin-right:4px}
.r b{color:var(--ac)}
.s{color:var(--ok)}.a{color:var(--no)}
</style></head><body>
<div class="bar"><b>🎧 English</b><span id="st"></span><button id="mb">🎤</button></div>
<input id="t" placeholder="ё нависед…" autocomplete="off">
<div id="list"></div>
<script>
// [калима, тарҷума, синоним, антоним, овоз бо кириллӣ]
const D=[
["alone","танҳо, ягона","","with others","алоун"],
["apartment","хона дар бино, квартира","flat","","апартмент"],
["article","мақола","","","артикл"],
["artist","рассом, ҳунарманд","painter","","артист"],
["attitude","муносибат, рафтор","","","аттитьюд"],
["compare","муқоиса кардан","contrast","","компэр"],
["judge","баҳо додан, доварӣ кардан","","","джадж"],
["magazine","маҷалла","","","мэгэзин"],
["material","масолеҳ, модда","","","матириал"],
["meal","хӯрок","","","мил"],
["method","усул","","","мэсод"],
["neighbor","ҳамсоя","","","нэйбор"],
["professional","касбӣ","expert","amateur","профэшнл"],
["profit","фоида, даромад","benefit","","профит"],
["quality","сифат","standard","","квалити"],
["shape","шакл, намуд","form, structure","","шейп"],
["space","ҷой (холӣ), фазо","place, room","","спэйс"],
["stair","зина, зинапоя","","","стэр"],
["symbol","нишона, аломат","sign","","симбол"],
["thin","лоғар, борик","skinny, light","fat, heavy","син"],
["decision","тасмим, қарор","conclusion","","дисижн"],
["either","ё, яке аз ду","or","","айзэр"],
["forest","ҷангал","jungle","","форист"],
["ground","замин","land","","граунд"],
["introduce","шинос кардан","","","интродьюс"],
["marry","оиладор шудан, издивоҷ кардан","","","мэри"],
["prepare","омода шудан, тайёр кардан","make ready, get ready","","припэр"],
["sail","бо киштӣ шино кардан","","","сэйл"],
["serious","ҷиддӣ, хатарнок","","","сириас"],
["spend","гузарондан, сарф кардан","expend","","спэнд"],
["strange","аҷиб, ғайриоддӣ","weird","","стрэйндж"],
["truth","ҳақиқат, ростӣ","","","труз"],
["wake","бедор шудан","awake","sleep","вэйк"]
];
// рақами тартибӣ мувофиқи китоб: 20-тои аввал = Chapter 12 (1-20), боқӣ = Chapter 11 (8-20)
const num=i=>i<20?"12-"+(i+1):"11-"+(i-12);

const $=id=>document.getElementById(id);
const list=$("list"),st=$("st"),mb=$("mb"),t=$("t");
const cy={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"j",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ъ:"",ы:"i",ь:"",э:"e",ю:"yu",я:"ya",ғ:"g",қ:"k",ӣ:"i",ӯ:"u",ҳ:"h",ҷ:"j"};
const tl=s=>[...s.toLowerCase()].map(c=>cy[c]!==undefined?cy[c]:c).join("").replace(/[^a-z]/g,"");
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=[...Array(n+1).keys()];
 for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
const keys=D.map(d=>[tl(d[0]),tl(d[4])]);
function find(tok){const k=tl(tok);if(k.length<3)return -1;let best=-1,bs=0;
 keys.forEach((kk,i)=>{const s=Math.max(sim(k,kk[0]),sim(k,kk[1]));if(s>bs){bs=s;best=i}});
 return bs>=0.62?best:-1}
function say(w){try{const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function show(i){
 const d=D[i];
 const old=list.querySelector('[data-i="'+i+'"]');if(old)old.remove();
 const r=document.createElement("div");r.className="r";r.dataset.i=i;
 const n=document.createElement("span");n.className="n";n.textContent=num(i);
 const w=document.createElement("b");w.textContent=d[0];
 r.append(n,w,document.createTextNode(" - "+d[1]));
 if(d[2]){const s=document.createElement("span");s.className="s";s.textContent=" - Син: "+d[2];r.appendChild(s)}
 if(d[3]){const a=document.createElement("span");a.className="a";a.textContent=" - Ант: "+d[3];r.appendChild(a)}
 r.onclick=()=>say(d[0]);
 list.prepend(r);
}
function handle(text){
 (text.toLowerCase().match(/[\p{L}']+/gu)||[]).forEach(x=>{const i=find(x);if(i>=0)show(i)});
}

// гирифтани матн аз қуттӣ (барои клавиатураи овозӣ)
let tm;t.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(()=>{const v=t.value.trim();if(v){handle(v);t.value=""}},1200)});

// микрофони доимӣ
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,want=false,on=false;
function ui(){mb.textContent=on?"🔴":"🎤";if(on&&!st.textContent.startsWith("…"))st.textContent="гӯш мекунам"}
function begin(){try{rec.start()}catch(e){}}
async function initNative(){
 const N=Capacitor.registerPlugin("SpeechRecognition");
 let prev=[];
 try{
  const a=await N.available();
  if(!a.available){st.textContent="шунавоии овоз нест";return}
  const p=await N.requestPermissions();
  if(p.speechRecognition&&p.speechRecognition!=="granted"){st.textContent="иҷозати микрофон нест";return}
 }catch(e){st.textContent="микрофон кор накард";return}
 const matched=txt=>{const r=[];(txt.toLowerCase().match(/[\p{L}']+/gu)||[]).forEach(x=>{const i=find(x);if(i>=0&&!r.includes(i))r.push(i)});return r};
 const go=()=>N.start({language:"en-US",maxResults:3,partialResults:true,popup:false}).catch(()=>{if(want)setTimeout(go,1000)});
 N.addListener("partialResults",d=>{
  const m=(d.matches&&d.matches[0])||"";if(!m)return;
  st.textContent="… "+m;
  const cur=matched(m);cur.forEach(i=>{if(!prev.includes(i))show(i)});prev=cur;
 });
 N.addListener("listeningState",d=>{
  if(d.status==="started"){on=true;st.textContent="гӯш мекунам";ui()}
  else{on=false;ui();prev=[];if(want)setTimeout(go,250);else st.textContent="қатъ"}
 });
 mb.onclick=()=>{want=!want;if(want)go();else N.stop().catch(()=>{})};
 want=true;go();
}
function init(){
 if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){initNative();return}
 if(!SR){st.textContent="микрофон нест: клавиатура 🎤";mb.style.display="none";return}
 rec=new SR();rec.lang="en-US";rec.continuous=true;rec.interimResults=true;
 rec.onstart=()=>{on=true;st.textContent="гӯш мекунам";ui()};
 rec.onend=()=>{on=false;ui();if(want)setTimeout(begin,300);else st.textContent="қатъ"};
 rec.onerror=e=>{
  if(e.error==="not-allowed"||e.error==="service-not-allowed"){want=false;st.textContent="иҷозати микрофон нест"}
  else if(e.error==="network"){st.textContent="интернет лозим аст"}
 };
 rec.onresult=e=>{
  let p="";
  for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
   if(r.isFinal)handle(r[0].transcript);else p+=r[0].transcript}
  st.textContent=p?"… "+p:"гӯш мекунам";
 };
 mb.onclick=()=>{want=!want;if(want)begin();else rec.stop()};
 want=true;begin();
 document.addEventListener("click",()=>{if(want&&!on)begin()},{once:true});
}
init();
</script>
</body></html>
